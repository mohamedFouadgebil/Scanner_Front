<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Red Phantom Scanner</title>
    <link rel="icon" href="./images/Red Phantom.png" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #060913;
        font-family:
          Segoe UI,
          sans-serif;
        color: #e5e7eb;
      }
      ::-webkit-scrollbar {
        width: 7px;
      }
      ::-webkit-scrollbar-thumb {
        background: #ff003c;
        border-radius: 10px;
      }
      .bg {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 20% 20%, #ff003c30, transparent 40%),
          radial-gradient(circle at 80% 80%, #ff003c15, transparent 45%);
        z-index: -1;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 28px;
        background: #0b0f1a;
        border-bottom: 1px solid #ff003c40;
      }
      .logo {
        font-size: 26px;
        font-weight: 900;
        color: #ff003c;
        text-shadow: 0 0 14px #ff003c;
      }
      .back {
        background: #111827;
        border: 1px solid #ff003c40;
        color: #fff;
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
      }
      .container {
        max-width: 1550px;
        margin: auto;
        padding: 26px;
      }
      .panel {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 12px;
        background: #0d1117;
        padding: 18px;
        border-radius: 18px;
        border: 1px solid #ff003c35;
        box-shadow: 0 0 35px #ff003c20;
      }
      .panel input {
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #ff003c40;
        background: #111827;
        color: #fff;
        font-size: 16px;
      }
      button {
        padding: 12px 18px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #ff003c, #ff4d6d);
        color: #fff;
        font-weight: 900;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 25px #ff003c80;
      }
      button.alt {
        background: #111827;
        border: 1px solid #ff003c40;
      }
      .logs-box {
        margin-top: 22px;
        background: #05070d;
        border: 1px solid #ff003c40;
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 0 30px #ff003c20;
      }
      .logs {
        height: 140px;
        overflow: auto;
        font-size: 13px;
        line-height: 1.6;
      }
      .overview {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-top: 26px;
      }
      .card {
        background: #0d1117;
        padding: 22px;
        border-radius: 18px;
        border: 1px solid #ff003c30;
        text-align: center;
        box-shadow: 0 0 30px #ff003c15;
        transition: 0.3s;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 45px #ff003c40;
      }
      .card h4 {
        color: #ff003c;
        font-size: 12px;
        letter-spacing: 1px;
      }
      .card p {
        font-size: 30px;
        font-weight: 900;
        margin-top: 6px;
      }
      .main {
        display: grid;
        grid-template-columns: 2.2fr 1fr;
        gap: 20px;
        margin-top: 26px;
      }
      .box {
        background: #0d1117;
        border-radius: 18px;
        border: 1px solid #ff003c30;
        padding: 18px;
        box-shadow: 0 0 30px #ff003c20;
      }
      .box h3 {
        margin: 0 0 14px;
        color: #ff003c;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }
      .controls button {
        background: #111827;
        border: 1px solid #ff003c40;
      }
      .search {
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ff003c40;
        background: #05070d;
        color: #fff;
        width: 100%;
      }
      .results {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 12px;
      }
      .item {
        border-radius: 14px;
        border: 1px solid #ffffff15;
        background: #0a0e16;
      }
      .item header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
      }
      .item pre {
        display: none;
        padding: 12px;
        background: #05070d;
      }
      .item.open pre {
        display: block;
      }
      .low {
        border-left: 4px solid #22c55e;
      }
      .med {
        border-left: 4px solid #f59e0b;
      }
      .high {
        border-left: 4px solid #ef4444;
      }
      .badge {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 900;
      }
      .low .badge {
        background: #22c55e;
      }
      .med .badge {
        background: #f59e0b;
      }
      .high .badge {
        background: #ef4444;
      }
      .solutions ul {
        padding-left: 18px;
        line-height: 1.8;
      }
      .bottom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 26px;
      }
      .history {
        margin-top: 14px;
        font-size: 12px;
      }
      .history div {
        padding: 6px;
        border-bottom: 1px solid #ffffff10;
      }
      @media (max-width: 1000px) {
        .panel {
          grid-template-columns: 1fr;
        }
        .overview {
          grid-template-columns: 1fr;
        }
        .main {
          grid-template-columns: 1fr;
        }
        .bottom {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="nav">
      <div class="logo">Red Phantom</div>
      <button class="back" onclick="history.back()">Back</button>
    </div>
    <div class="container">
      <div class="panel">
        <input id="urlInput" placeholder="https://target.com" />
        <button id="scanBtn">Start Scan</button>
        <button class="alt" onclick="exportJSON()">Export JSON</button>
        <button class="alt" onclick="exportPDF()">Export PDF</button>
      </div>
      <div class="logs-box">
        <div class="logs" id="logs"></div>
      </div>
      <div class="overview">
        <div class="card">
          <h4>CHECKS</h4>
          <p id="total">-</p>
        </div>
        <div class="card">
          <h4>ISSUES</h4>
          <p id="issues">-</p>
        </div>
        <div class="card">
          <h4>RISK</h4>
          <p id="risk">-</p>
        </div>
        <div class="card">
          <h4>SCORE</h4>
          <p id="score">-</p>
        </div>
      </div>
      <div class="main">
        <div class="box">
          <h3>Scan Results</h3>
          <div class="controls">
            <button onclick="setFilter('all')">All</button>
            <button onclick="setFilter('issues')">Issues</button>
          </div>
          <input
            class="search"
            placeholder="Search..."
            oninput="search(this.value)"
          />
          <div class="results" id="results"></div>
        </div>
        <div class="box solutions">
          <h3>Fix Solutions</h3>
          <ul id="solutions"></ul>
          <div class="history" id="history"></div>
        </div>
      </div>
      <div class="bottom">
        <div class="box" style="max-width: 400px; margin: auto">
          <canvas id="riskChart" height="250"></canvas>
        </div>
        <div class="box" style="padding: 18px">
          <h3>Top Issues Summary</h3>
          <div id="breakdown" style="font-size: 14px; line-height: 1.6">
            High: 0<br />Medium: 0<br />Low: 0
          </div>
        </div>
      </div>
    </div>
    <script>
      let all = [],
        view = [],
        chart;

      const API = "https://scanner-l32b.vercel.app";

      const logs = document.getElementById("logs");

      function log(t) {
        logs.innerHTML += `[+] ${t}<br>`;
        logs.scrollTop = logs.scrollHeight;
      }

      scanBtn.onclick = async () => {
        let u = urlInput.value.trim();
        if (!u) return;
        if (!u.startsWith("http")) u = "https://" + u;

        logs.innerHTML = "";
        log("Resolving domain...");
        log("Running security scan...");

        try {
          const res = await fetch(`${API}/api/scan`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: u }),
          });

          const d = await res.json();
          render(d);
          log("Scan completed successfully.");
          saveHistory(u);
        } catch (err) {
          log("Error: " + err.message);
        }
      };

      function sev(issue) {
        let t = issue.toLowerCase(),
          s = 1;
        if (t.includes("critical") || t.includes("vulnerable")) s = 3;
        else if (
          t.includes("missing") ||
          t.includes("warning") ||
          t.includes("dangerous")
        )
          s = 2;
        return s;
      }

      function render(d) {
        results.innerHTML = "";
        solutions.innerHTML = "";
        all = [];

        let high = 0,
          med = 0,
          low = 0,
          totalChecks = 0;

        for (let k in d) {
          let items = Array.isArray(d[k]) ? d[k] : [d[k]];
          all.push({ k, v: items, s: sev(JSON.stringify(items)) });

          if (k !== "url" && k !== "status") {
            totalChecks++;
            const s = sev(JSON.stringify(items));
            if (s === 3) high++;
            else if (s === 2) med++;
            else low++;
          }
        }

        view = [...all];
        draw();

        (d.steps || []).forEach((x) => {
          const li = document.createElement("li");
          li.textContent = x;
          solutions.appendChild(li);
        });

        total.innerText = totalChecks;
        issues.innerText = high + med + low;

        let riskLevel = "Low";
        if (high > 0 || med > 2) riskLevel = "High";
        else if (med > 0) riskLevel = "Medium";

        risk.innerText = riskLevel;

        let scoreVal = Math.max(0, 100 - (high * 20 + med * 10));
        score.innerText = scoreVal + "/100";

        document.getElementById("breakdown").innerHTML =
          `High: ${high}<br>Medium: ${med}<br>Low: ${low}`;

        drawChart(high, med, low);
      }

      function draw() {
        results.innerHTML = "";
        let i = 1;

        view.forEach((x) => {
          results.innerHTML += `<div class="item ${
            x.s > 2 ? "high" : x.s > 1 ? "med" : "low"
          }"><header><strong>${i}. ${x.k}</strong><span class="badge">${
            x.s > 2 ? "HIGH" : x.s > 1 ? "MED" : "LOW"
          }</span><button onclick="this.parentNode.parentNode.classList.toggle('open')">View</button></header><pre>${JSON.stringify(
            x.v,
            null,
            2,
          )}</pre></div>`;
          i++;
        });
      }

      function setFilter(t) {
        view = t === "issues" ? all.filter((x) => x.s > 1) : [...all];
        draw();
      }

      function search(v) {
        view = all.filter((x) => x.k.toLowerCase().includes(v.toLowerCase()));
        draw();
      }

      function drawChart(h, m, l) {
        if (chart) chart.destroy();
        chart = new Chart(riskChart, {
          type: "doughnut",
          data: {
            labels: ["High", "Medium", "Low"],
            datasets: [
              {
                data: [h, m, l],
                backgroundColor: ["#ef4444", "#f59e0b", "#22c55e"],
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });
      }

      function exportJSON() {
        const b = new Blob([JSON.stringify(all, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "scan.json";
        a.click();
      }

      function exportPDF() {
        const { jsPDF } = window.jspdf;
        const p = new jsPDF();

        p.text("Red Phantom Scan Report", 10, 10);

        let y = 20;

        all.forEach((r) => {
          p.text(
            r.k + " [" + (r.s > 2 ? "HIGH" : r.s > 1 ? "MED" : "LOW") + "]",
            10,
            y,
          );
          y += 8;
          p.text(JSON.stringify(r.v, null, 2), 12, y);
          y += 14;
        });

        p.save("scan.pdf");
      }

      function saveHistory(u) {
        let h = JSON.parse(localStorage.getItem("scanHistory") || "[]");
        h.unshift({ u, d: new Date().toLocaleString() });
        h = h.slice(0, 5);
        localStorage.setItem("scanHistory", JSON.stringify(h));
        renderHistory();
      }

      function renderHistory() {
        const h = JSON.parse(localStorage.getItem("scanHistory") || "[]");
        history.innerHTML = "<strong>Recent Scans</strong>";
        h.forEach((x) => {
          history.innerHTML += `<div>${x.u}<br>${x.d}</div>`;
        });
      }

      renderHistory();
    </script>
  </body>
</html>
